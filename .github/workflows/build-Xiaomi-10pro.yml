name: Build Xiaomi 10 Pro (cmi) (MIUI A16)

on:
  workflow_call:
  workflow_dispatch:

env:
  # 设备基础配置
  DEVICE_NAME : "小米10pro"
  DEVICE_CODENAME : "cmi"

  # 编译工具链配置（修复 LLVM 汇编器兼容）
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump"

  # 内核源码（确认分支适配 Android 16）
  KERNEL_SOURCE : "https://github.com/wsmnb6/kernel_xiaomi_sm8250_mod"
  KERNEL_BRANCH : "android16-aptusitu-rksu"

  # LLVM 19 工具链（适配 ARM64 32位 VDSO 编译）
  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  # GCC 工具链（32位兼容编译依赖）
  GCC_GNU : true  # 改为 true，LLVM 编译 32 位 VDSO 需要 GCC 辅助
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  # 配置文件
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "arch/arm64/configs/vendor/xiaomi/cmi.config"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU 配置
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "rsuntk"

  # 其他可选功能
  SUSFS_ENABLE : false
  SUSFS_FIXED : false
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "rom_android"

  # 基础环境配置
  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  KERNELSU_METHOD: "shell"
  PATCHES_SOURCE: "author/source"
  PATCHES_BRANCH: "branch"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  HIDE_STUFF: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "true"  # 开启编译调试，便于定位错误
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"
  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04  # 改用 22.04 更稳定，避免最新版兼容问题
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options (修复汇编错误核心步骤)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # 修复 sigreturn.S mov 指令立即数错误
          sed -i 's/mov r7, #__NR_compat_rt_sigreturn/movw r7, #:lower16:__NR_compat_rt_sigreturn\n\tmovt r7, #:upper16:__NR_compat_rt_sigreturn/' arch/arm64/kernel/vdso32/sigreturn.S
          # 修复 .pad 指令偏移量错误
          sed -i 's/\.pad #COMPAT_SIGFRAME_REGS_OFFSET/.set COMPAT_SIGFRAME_REGS_OFFSET_VAL, COMPAT_SIGFRAME_REGS_OFFSET\n\t.pad #COMPAT_SIGFRAME_REGS_OFFSET_VAL/' arch/arm64/kernel/vdso32/sigreturn.S
          # 禁用不必要的 32 位 VDSO 调试选项（可选）
          echo "CONFIG_COMPAT_VDSO_DEBUG=n" >> $DEFCONFIG_NAME

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
